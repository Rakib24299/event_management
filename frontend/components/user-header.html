<header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 sm:py-5 lg:px-8">
        <!-- EventEase Logo -->
        <a id="userHeaderLogoLink" href="./dashboard.html" class="text-2xl font-extrabold tracking-tight text-primary">
            <span class="text-black">Event</span>Ease
        </a>

        <!-- Right Side: Logged In User Controls -->
        <div id="userHeaderAuthControls" class="flex items-center gap-3">
            <!-- Notification -->
            <a
                href="./notifications.html"
                class="relative flex h-11 w-11 items-center justify-center rounded-2xl bg-gray-100 text-xl transition hover:bg-primaryLight hover:text-white"
                title="Notifications"
            >
                <svg class="h-5 w-5 text-current inline-block align-middle" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                <span
                    id="notificationBadge"
                    class="absolute -right-1 -top-1 hidden h-5 min-w-[20px] items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white shadow-sm ring-2 ring-white"
                >0</span>
            </a>

            <!-- My Account -->
            <a
                href="./profile.html"
                class="hidden rounded-xl px-4 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-100 sm:block"
            >
                My Account
            </a>

            <!-- Logout -->
            <button
                id="logoutBtn"
                type="button"
                class="rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primaryDark"
            >
                Logout
            </button>
        </div>

        <!-- Right Side: Guest User Controls (when not logged in) -->
        <div id="userHeaderGuestControls" class="hidden items-center gap-3">
            <a
                href="./user-login.html"
                class="rounded-xl px-4 py-2.5 text-sm font-semibold text-gray-700 transition hover:bg-gray-100"
            >
                Login
            </a>
            <a
                href="../register.html"
                class="rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primaryDark"
            >
                Get Started
            </a>
        </div>
    </div>
</header>
