<header class="relative z-50 border-b border-gray-200 bg-white">

    <div
        class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
    >

        <!-- EventEase -->

        <a
            href="./index.html"
            class="text-2xl font-extrabold tracking-tight text-primary"
        >
            <span class="text-black">Event</span>Ease
        </a>

        <!-- Desktop Right Side -->

        <div class="hidden items-center gap-3 md:flex">

            <!-- Login Dropdown -->

            <div class="relative">

                <button
                    id="loginDropdownButton"
                    type="button"
                    class="rounded-xl px-4 py-2.5 text-sm font-semibold text-gray-700 transition hover:bg-gray-100"
                >
                    Login
                </button>

                <div
                    id="loginDropdown"
                    class="hidden absolute right-0 top-full mt-2 z-50 w-40 rounded-xl border border-gray-200 bg-white py-2 shadow-lg"
                >

                    <a
                        href="./pages/user/user-login.html"
                        class="block px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-50 hover:text-primary"
                    >
                        User
                    </a>

                    <a
                        href="./pages/organizer/organizer-login.html"
                        class="block px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-50 hover:text-primary"
                    >
                        Organizer
                    </a>

                    <a
                        href="./pages/admin/admin-login.html"
                        class="block px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-50 hover:text-primary"
                    >
                        Admin
                    </a>

                </div>

            </div>

            <!-- Get Started -->

            <a
                href="./pages/register.html"
                class="rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primaryDark"
            >
                Get Started
            </a>

        </div>

        <!-- Mobile Menu Button -->

        <button
            id="mobileMenuButton"
            type="button"
            class="rounded-xl p-2 text-gray-700 transition hover:bg-gray-100 md:hidden"
        >

            <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                />

            </svg>

        </button>

    </div>

    <!-- Mobile Menu -->

    <div
        id="mobileMenu"
        class="hidden border-t border-gray-200 bg-white px-4 py-4 sm:px-6 md:hidden"
    >

        <!-- Mobile Login Dropdown -->

        <div class="mb-4">

            <button
                id="mobileLoginButton"
                type="button"
                class="flex w-full items-center justify-between rounded-xl px-4 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-100"
            >
                Login

                <svg
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 9l-7 7-7-7"
                    />

                </svg>

            </button>

            <div
                id="mobileLoginOptions"
                class="hidden z-50 mt-2 space-y-1 pl-4"
            >

                <a
                    href="./pages/user/user-login.html"
                    class="block rounded-xl px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-50 hover:text-primary"
                >
                    User
                </a>

                <a
                    href="./pages/organizer/organizer-login.html"
                    class="block rounded-xl px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-50 hover:text-primary"
                >
                    Organizer
                </a>

                <a
                    href="./pages/admin/admin-login.html"
                    class="block rounded-xl px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-50 hover:text-primary"
                >
                    Admin
                </a>

            </div>

        </div>

        <!-- Mobile Get Started -->

        <a
            href="./pages/register.html"
            class="block rounded-xl bg-primary px-4 py-3 text-center text-sm font-semibold text-white transition hover:bg-primaryDark"
        >
            Get Started
        </a>

    </div>

</header>
