<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | EventEase</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-gray-50">


    <!-- =========================================
         Main
    ========================================== -->

    <main
        class="
            min-h-screen
            flex
            items-center
            justify-center
            px-4
            py-10
        "
    >

        <div class="w-full max-w-md ">


            <!-- =====================================
                 Logo
            ====================================== -->

            <div class="text-center mb-8">

                <a
                    href="../home.html"
                    class="
                        text-3xl
                        font-extrabold
                        text-[#31572c]
                    "
                >
                    EventEase
                </a>

                <p class="mt-2 text-sm text-gray-500">
                    Event Management System
                </p>

            </div>



            <!-- =====================================
                 Forgot Password Card
            ====================================== -->

            <section
                class="
                    bg-white
                    rounded-2xl
                    shadow-sm
                    border
                    border-gray-100
                    p-6
                    sm:p-8
                "
            >


                <!-- Heading -->

                <div class="text-center">

                    <div
                        class="
                            mx-auto
                            flex
                            h-16
                            w-16
                            items-center
                            justify-center
                            rounded-full
                            bg-indigo-50
                            text-3xl
                        "
                    >
                        🔐
                    </div>


                    <h1
                        class="
                            mt-5
                            text-2xl
                            font-bold
                            text-red-500
                        "
                    >
                        Forgot Password?
                    </h1>


                    <p
                        class="
                            mt-2
                            text-sm
                            leading-6
                            text-gray-500
                        "
                    >
                        Enter your registered email address.
                        We will send you a verification OTP.
                    </p>

                </div>



                <!-- =================================
                     Error / Success Message
                ================================== -->

                <div
                    id="message"
                    class="
                        hidden
                        mt-6
                        rounded-lg
                        px-4
                        py-3
                        text-sm
                    "
                ></div>



                <!-- =================================
                     Forgot Password Form
                ================================== -->

                <form
                    id="forgotPasswordForm"
                    class="mt-6"
                >


                    <!-- Email -->

                    <div>

                        <label
                            for="email"
                            class="
                                block
                                text-sm
                                font-semibold
                                text-gray-700
                                mb-2
                            "
                        >
                            Email Address
                        </label>


                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="Enter your email address"
                            required
                            class="
                                w-full
                                rounded-lg
                                border
                                border-gray-300
                                px-4
                                py-3
                                text-sm
                                text-gray-900
                                outline-none
                                transition
                                focus:border-indigo-500
                                focus:ring-2
                                focus:ring-indigo-100
                            "
                        >

                    </div>



                    <!-- Send OTP Button -->

                    <button
                        id="sendOtpButton"
                        type="submit"
                         href="./verify-forgot-otp.html"
                        class=" mt-5 w-full rounded-lg bg-[#31572c]  px-5 py-3 text-sm font-semibold  text-white transition  hover:bg-indigo-700   disabled:cursor-not-allowed disabled:opacity-60 " >
                        Send OTP
                    </button>


                </form>



                <!-- =================================
                     Back to Login
                ================================== -->

                <div class="mt-6 text-center">

                    <a
                        href="./user-login.html"
                        class="
                            text-sm
                            font-semibold
                            text-[#31572c]
                            
                        "
                    >
                        ← Back to Login
                    </a>

                </div>


            </section>


            <!-- Footer -->

            <!-- <p
                class="
                    mt-6
                    text-center
                    text-xs
                    text-gray-400
                "
            >
                © EventEase. All rights reserved.
            </p> -->


        </div>

    </main>



    <!-- =========================================
         JavaScript
    ========================================== -->

    <script src="../../js/user/forgot-password.js"></script>

</body>

</html>
