<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>My Bookings | EventEase</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col min-h-screen bg-gray-50 text-gray-800">



  <!-- ==============================
       HEADER
  =============================== -->

  <header class="border-b border-gray-200 bg-white">

    <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 lg:px-8"
    >

        <!-- EventEase -->

        <a
            href="./dashboard.html"
            class="text-2xl font-extrabold tracking-tight text-primary"
        >
             <span class="text-black">Event</span><span class="text-[#31572c]">Ease</span>
        </a>

        <!-- Right Side -->

        <div class="flex items-center gap-3">

            <!-- Notification -->

            <a
                href="./notifications.html"
                class="relative flex h-11 w-11 items-center justify-center rounded-2xl bg-gray-100 text-xl transition hover:bg-primaryLight hover:text-white"
                title="Notifications" >

                🔔

                <span
                    id="notificationBadge"
                    class="absolute -right-1 -top-1 hidden h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white"
                >
                    0
                </span>

            </a>

            <!-- My Account -->

            <a
                href="./profile.html"
                class="hidden rounded-xl px-4 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-100 sm:block"
            >
                My Account
            </a>

            <!-- Logout -->

            <!-- <button
                id="logoutBtn"
                type="button"
                class="rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primaryDark"
            >
                Logout
            </button> -->

        </div>

    </div>

</header>


  <!-- ==============================
       Main
  =============================== -->

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Page Heading -->

    <div class="mb-8">

      <h1 class="text-3xl font-bold text-gray-900">
        My Bookings
      </h1>

      <p class="mt-2 text-gray-500">
        View your bookings, payment status and refund information.
      </p>

    </div>


    <!-- ==============================
         Loading
    =============================== -->

    <div
      id="loadingState"
      class="bg-white rounded-xl shadow-sm p-10 text-center"
    >

      <div
        class="inline-block w-8 h-8
               border-4 border-gray-200
               border-t-indigo-600
               rounded-full animate-spin"
      ></div>

      <p class="mt-4 text-gray-500">
        Loading your bookings...
      </p>

    </div>


    <!-- ==============================
         Error
    =============================== -->

    <div
      id="errorState"
      class="hidden bg-red-50 border border-red-200
             rounded-xl p-5 mb-6"
    >

      <p
        id="errorMessage"
        class="text-red-600"
      ></p>

      <button
        id="retryBtn"
        type="button"
        class="mt-3 px-4 py-2
               bg-red-600 text-white rounded-lg
               hover:bg-red-700"
      >
        Try Again
      </button>

    </div>


    <!-- ==============================
         Empty State
    =============================== -->

    <div
      id="emptyState"
      class="hidden bg-white rounded-xl shadow-sm
             p-12 text-center"
    >

      <div class="text-5xl mb-4">
        📅
      </div>

      <h2 class="text-xl font-semibold text-gray-800">
        No Bookings Found
      </h2>

      <p class="mt-2 text-gray-500">
        You haven't made any bookings yet.
      </p>

      <a
        href="../events.html"
        class="inline-block mt-5 px-5 py-2.5
               bg-indigo-600 text-white rounded-lg
               hover:bg-indigo-700 transition"
      >
        Browse Events
      </a>

    </div>


    <!-- ==============================
         Booking Container
    =============================== -->

    <div
      id="bookingsContainer"
      class="hidden space-y-6"
    ></div>

  </main>


  <!-- ==============================
       Cancel Modal
  =============================== -->

  <div
    id="cancelModal"
    class="hidden fixed inset-0 z-50
           bg-black/50 flex items-center justify-center
           px-4"
  >

    <div
      class="bg-white w-full max-w-md
             rounded-2xl shadow-xl p-6"
    >

      <h2 class="text-xl font-bold text-gray-900">
        Cancel Booking
      </h2>

      <p class="mt-3 text-gray-600">
        Are you sure you want to cancel this booking?
      </p>

      <!-- Refund Preview -->

      <div
        id="refundPreview"
        class="mt-5 bg-gray-50 rounded-lg p-4"
      >

        <div class="flex justify-between mb-2">
          <span class="text-gray-500">
            Refund Percentage
          </span>

          <span
            id="refundPercentage"
            class="font-semibold"
          >
            -
          </span>
        </div>

        <div class="flex justify-between">
          <span class="text-gray-500">
            Refund Amount
          </span>

          <span
            id="refundAmount"
            class="font-semibold text-green-600"
          >
            -
          </span>
        </div>

      </div>


      <!-- Modal Buttons -->

      <div class="flex justify-end gap-3 mt-6">

        <button
          id="closeCancelModalBtn"
          type="button"
          class="px-4 py-2 rounded-lg
                 border border-gray-300
                 text-gray-700
                 hover:bg-gray-100"
        >
          Keep Booking
        </button>

        <button
          id="confirmCancelBtn"
          type="button"
          class="px-4 py-2 rounded-lg
                 bg-red-600 text-white
                 hover:bg-red-700"
        >
          Confirm Cancellation
        </button>

      </div>

    </div>

  </div>


  <!-- ==============================
       Toast
  =============================== -->

  <div
    id="toast"
    class="hidden fixed bottom-5 right-5 z-[60]
           max-w-sm px-5 py-4 rounded-lg shadow-lg
           text-white"
  >
    <p id="toastMessage"></p>
  </div>


  <!-- ==============================
       FOOTER
  =============================== -->

  <div id="user-footer"></div>


  <!-- ==============================
       COMPONENTS
  =============================== -->

  <script src="../../js/components.js"></script>


  <script>

      Promise.all([

          loadComponent(
              "user-header",
              "../../components/user-header.html"
          ),

          loadComponent(
              "user-footer",
              "../../components/user-footer.html"
          )

      ]);

  </script>


  <!-- ==============================
       JavaScript
  =============================== -->

  <script src="../../js/user/my-bookings.js"></script>

  <!-- AI -->
     <script src="../../js/components/ai-chatbot.js"></script>

</body>
</html>
