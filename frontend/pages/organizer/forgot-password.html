<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | EventEase</title>


    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Tailwind Configuration -->

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: "#e76f51",

                        primaryDark: "#c9553b",

                        primaryLight: "#fce9e4",

                    }

                }

            }

        };

    </script>


    <!-- Global CSS -->

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

</head>


<body class="flex min-h-screen flex-col bg-gray-50 text-gray-900">


    <!-- =========================================
         Main
    ========================================== -->

    <main
        class="
            min-h-screen
            flex
            items-center
            justify-center
            px-4
            py-10
        "
    >

        <div class="w-full max-w-md">


            <!-- =====================================
                 Logo
            ====================================== -->

            <div class="text-center mb-8">

                <a
                    href="../home.html"
                    class="
                        text-3xl
                        font-extrabold
                        text-[#e76f51]
                    "
                >
                    EventEase
                </a>

                <p class="mt-2 text-sm text-gray-500">
                    Organizer Management System
                </p>

            </div>



            <!-- =====================================
                 Forgot Password Card
            ====================================== -->

            <section
                class="
                    bg-white
                    rounded-2xl
                    shadow-sm
                    border
                    border-gray-100
                    p-6
                    sm:p-8
                "
            >


                <!-- Heading -->

                <div class="text-center">

                    <div
                        class="
                            mx-auto
                            flex
                            h-16
                            w-16
                            items-center
                            justify-center
                            rounded-full
                            bg-[#fce9e4]
                            text-3xl
                        "
                    >
                        <svg class="h-5 w-5 text-current inline-block align-middle" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                    </div>


                    <h1
                        class="
                            mt-5
                            text-2xl
                            font-bold
                            text-[#e76f51]
                        "
                    >
                        Forgot Password?
                    </h1>


                    <p
                        class="
                            mt-2
                            text-sm
                            leading-6
                            text-gray-500
                        "
                    >
                        Enter your registered organizer
                        email address. We will send you
                        a verification OTP.
                    </p>

                </div>



                <!-- =================================
                     Error / Success Message
                ================================== -->

                <div
                    id="message"
                    class="
                        hidden
                        mt-6
                        rounded-lg
                        px-4
                        py-3
                        text-sm
                    "
                ></div>



                <!-- =================================
                     Forgot Password Form
                ================================== -->

                <form
                    id="forgotPasswordForm"
                    class="mt-6"
                >


                    <!-- Email -->

                    <div>

                        <label
                            for="email"
                            class="
                                block
                                text-sm
                                font-semibold
                                text-gray-700
                                mb-2
                            "
                        >
                            Organizer Email Address
                        </label>


                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="Enter your organizer email"
                            required
                            class="
                                w-full
                                rounded-lg
                                border
                                border-gray-300
                                px-4
                                py-3
                                text-sm
                                text-gray-900
                                outline-none
                                transition
                                focus:border-[#e76f51]
                                focus:ring-2
                                focus:ring-[#fce9e4]
                            "
                        >

                    </div>



                    <!-- Send OTP Button -->

                    <button
                        id="sendOtpButton"
                        type="submit"
                        class="
                            mt-5
                            w-full
                            rounded-lg
                            bg-[#e76f51]
                            px-5
                            py-3
                            text-sm
                            font-semibold
                            text-white
                            transition
                            hover:bg-[#c9553b]
                            disabled:cursor-not-allowed
                            disabled:opacity-60
                        "
                    >
                        Send OTP
                    </button>


                </form>



                <!-- =================================
                     Back to Organizer Login
                ================================== -->

                <div class="mt-6 text-center">

                    <a
                        href="./organizer-login.html"
                        class="
                            text-sm
                            font-semibold
                            text-[#e76f51]
                            transition
                            hover:text-[#c9553b]
                        "
                    >
                        ← Back to Organizer Login
                    </a>

                </div>


            </section>


        </div>

    </main>



    <!-- =========================================
         JavaScript
    ========================================== -->

    <script src="../../js/organizer/forgot-password.js"></script>


</body>

</html>
