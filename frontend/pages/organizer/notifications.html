<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications | EventEase</title>


    <!-- ========================================
         Tailwind CSS
    ========================================= -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- ========================================
         Tailwind Configuration
    ========================================= -->

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: "#fc9e4f",

                        primaryDark: "#e57f2f",

                        primaryLight: "#fff1e3",

                    },

                    boxShadow: {

                        soft:
                            "0 10px 30px rgba(0, 0, 0, 0.06)",

                    },

                },

            },

        };

    </script>

</head>


<body class="min-h-screen bg-gray-50 text-gray-800">


    <nav class="bg-white shadow-sm border-b">

        <div
            class="
                max-w-7xl
                mx-auto
                px-6
                py-4
                flex
                justify-between
                items-center
            "
        >

            <!-- Logo / Panel Name -->

            <div>

                <a href="./dashboard.html"
                 class="text-2xl font-bold text-gray-800">
                    Event<span class=text-[#e76f51]>Ease</span>
                </a>

            </div>


            <!-- Navigation Actions -->

            <div class="flex items-center gap-3">

                <!-- Dashboard -->

                <a
                    href="../organizer/dashboard.html"
                    class="
                        rounded-lg
                        border
                        border-gray-200
                        px-4
                        py-2
                        text-sm
                        font-semibold
                        text-gray-700
                        transition
                        hover:bg-gray-50
                    "
                >
                    Dashboard
                </a>


                <!-- Cancel / Back to Profile -->

                <!-- <a
                    href="./organizer-profile.html"
                    class="
                        rounded-lg
                        border
                        border-gray-200
                        px-4
                        py-2
                        text-sm
                        font-semibold
                        text-gray-700
                        transition
                        hover:bg-gray-50
                    "
                >
                    Cancel
                </a> -->


                <!-- Logout -->

                <!-- <button 
                    id="logoutButton"
                    type="button"
                    class=" rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700" >
                    Logout
                </button> -->

            </div>

        </div>

    </nav>



    <!-- ========================================
         Main Content
    ========================================= -->

    <main
        class="mx-auto min-h-[calc(100vh-220px)] max-w-5xl px-6 py-10"
    >


        <!-- ====================================
             Page Heading
        ===================================== -->

        <div class="mb-8">

            <h1
                class="text-3xl font-bold text-gray-900"
            >
                Notifications
            </h1>

            <p
                class="mt-2 text-sm text-gray-500"
            >
                Stay updated with your events and bookings.
            </p>

        </div>



        <!-- ====================================
             Notification Header
        ===================================== -->

        <section
            class="mb-6 flex flex-col gap-4 rounded-3xl bg-white p-6 shadow-soft sm:flex-row sm:items-center sm:justify-between"
        >

            <div>

                <h2
                    class="text-xl font-bold text-gray-900"
                >
                    Your Notifications
                </h2>

                <p
                    class="mt-1 text-sm text-gray-500"
                >
                    View your latest event and booking updates.
                </p>

            </div>


            <button
                id="markAllReadBtn"
                type="button"
                class="rounded-xl bg-primary px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-primaryDark"
            >
                Mark All as Read
            </button>

        </section>



        <!-- ====================================
             Notification List
        ===================================== -->

        <section
            id="notificationList"
            class="space-y-4"
        >


            <!-- Loading State -->

            <div
                id="loadingState"
                class="rounded-3xl bg-white p-10 text-center shadow-soft"
            >

                <div
                    class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-gray-200 border-t-primary"
                ></div>

                <p
                    class="mt-4 text-sm text-gray-500"
                >
                    Loading notifications...
                </p>

            </div>



            <!-- Empty State -->

            <div
                id="emptyState"
                class="hidden rounded-3xl bg-white p-10 text-center shadow-soft"
            >

                <div
                    class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-primaryLight text-3xl"
                >
                    🔔
                </div>

                <h3
                    class="mt-5 text-lg font-bold text-gray-900"
                >
                    No Notifications
                </h3>

                <p
                    class="mt-2 text-sm text-gray-500"
                >
                    You don't have any notifications yet.
                </p>

            </div>


        </section>


    </main>



   <!-- ======================================
         FOOTER
    ======================================= -->

    <footer class="mt-10 border-t border-gray-200 bg-white">

        <div
            class="mx-auto flex max-w-7xl flex-col gap-3 px-6 py-8 text-sm text-gray-500 sm:flex-row sm:items-center sm:justify-between lg:px-8"
        >

            <p class="transition hover:text-primary">
                © 2026 EventEase. All rights reserved.
            </p>

            <div class="flex gap-5">

                <p class="transition hover:text-primary">
                    developed by <span class="font-bold text-primary">Rakib</span>
                </p>

            </div>

        </div>

    </footer>


    <!-- ========================================
         JavaScript
    ========================================= -->

    <script src="../../js/organizer/notifications.js"></script>

</body>

</html>
