<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bookings | EventEase</title>


    <!-- ========================================
         Tailwind CSS
    ========================================= -->

    <script src="https://cdn.tailwindcss.com"></script>


    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        organizer: "#fc9e4f",

                    },

                },

            },

        };

    </script>

</head>


<body class="flex min-h-screen flex-col bg-gray-50 text-gray-800">

  <!-- ======================================
         NAVBAR
    ======================================= -->

    <header class="border-b bg-white">

        <div
            class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
        >

            <!-- Logo -->

            <a
                href="./dashboard.html"
                class="text-2xl font-bold text-primary" >
               
                 <span class="text-black">Event</span>Ease
            </a>


            <!-- Right Side -->

            <div class="flex items-center gap-3">

                <!-- Notification -->

                <a
                    href="./notifications.html"
                    class="relative flex h-11 w-11 items-center justify-center rounded-2xl bg-gray-100 text-xl transition hover:bg-primaryLight hover:text-white"
                    title="Notifications"
                >

                    <svg class="h-5 w-5 text-current inline-block align-middle" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>

                    <span
                        id="notificationBadge"
                        class="absolute -right-1 -top-1 hidden h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white"
                    >
                        0
                    </span>

                </a>


                <!-- Account -->

                <a
                    href="./organizer-profile.html"
                    class="rounded-xl px-4 py-2 text-sm font-semibold text-gray-600 transition hover:bg-primaryLight hover:text-primary"
                >
                    My Account
                </a>

            </div>

        </div>

    </header>



    <!-- ========================================
         Main
    ========================================= -->

    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-6 py-8">


        <!-- ====================================
             Error Message
        ===================================== -->

        <div
            id="errorMessage"
            class="hidden mb-6
                   p-4 rounded-lg
                   bg-red-50
                   border border-red-200
                   text-red-700"
        >
        </div>



        <!-- ====================================
             Success Message
        ===================================== -->

        <div
            id="successMessage"
            class="hidden mb-6
                   p-4 rounded-lg
                   bg-green-50
                   border border-green-200
                   text-green-700"
        >
        </div>



        <!-- ====================================
             Summary Cards
        ===================================== -->

        <section
            class="grid grid-cols-1
                   sm:grid-cols-2
                   gap-5 mb-8"
        >


            <!-- Total Bookings -->

            <div
                class="bg-white rounded-xl
                       border shadow-sm p-6">

                <p class="text-sm text-gray-500">
                    Total Bookings
                </p>

                <h2
                    id="totalBookings"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </h2>

            </div>



            <!-- Cancelled -->

            <div
                class="bg-white rounded-xl
                       border shadow-sm p-6"
            >

                <p class="text-sm text-gray-500">
                    Cancelled
                </p>

                <h2
                    id="cancelledBookings"
                    class="text-3xl font-bold
                           text-red-600 mt-2"
                >
                    0
                </h2>

            </div>

        </section>



        <!-- ====================================
             Filters
        ===================================== -->

        <section
            class="bg-white rounded-xl
                   border shadow-sm p-6 mb-6"
        >

            <div
                class="grid grid-cols-1
                       md:grid-cols-3 gap-4"
            >


                <!-- Search -->

                <div>

                    <label
                        for="searchInput"
                        class="block text-sm
                               font-medium mb-2"
                    >
                        Search
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search customer or booking..."
                        class="w-full px-4 py-3
                               border rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-orange-300"
                    >

                </div>



                <!-- Event Filter -->

                <div>

                    <label
                        for="eventFilter"
                        class="block text-sm
                               font-medium mb-2"
                    >
                        Event
                    </label>

                    <select
                        id="eventFilter"
                        class="w-full px-4 py-3
                               border rounded-lg
                               bg-white
                               focus:outline-none
                               focus:ring-2
                               focus:ring-orange-300"
                    >

                        <option value="">
                            All Events
                        </option>

                    </select>

                </div>



                <!-- Status Filter -->

                <div>

                    <label
                        for="statusFilter"
                        class="block text-sm
                               font-medium mb-2"
                    >
                        Booking Status
                    </label>

                    <select
                        id="statusFilter"
                        class="w-full px-4 py-3
                               border rounded-lg
                               bg-white
                               focus:outline-none
                               focus:ring-2
                               focus:ring-orange-300"
                    >

                        <option value="">
                            All Status
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="confirmed">
                            Confirmed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </div>

            </div>

        </section>



        <!-- ====================================
             Loading
        ===================================== -->

        <div
            id="loadingState"
            class="bg-white rounded-xl
                   border shadow-sm
                   p-10 text-center"
        >

            <p class="text-gray-500">
                Loading bookings...
            </p>

        </div>



        <!-- ====================================
             Empty State
        ===================================== -->

        <div
            id="emptyState"
            class="hidden bg-white
                   rounded-xl border
                   shadow-sm p-10
                   text-center"
        >

            <div
                class="text-5xl mb-4"
            >
                <svg class="h-5 w-5 text-current inline-block align-middle" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
            </div>

            <h2
                class="text-xl font-semibold"
            >
                No Bookings Found
            </h2>

            <p
                class="text-gray-500 mt-2"
            >
                There are no bookings matching your criteria.
            </p>

        </div>



        <!-- ====================================
             Booking Table
        ===================================== -->

        <section
            id="bookingSection"
            class="hidden bg-white
                   rounded-xl border
                   shadow-sm overflow-hidden"
        >

            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead
                        class="bg-gray-50 border-b"
                    >

                        <tr>

                            <th
                                class="px-6 py-4
                                       text-left text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Customer
                            </th>


                            <th
                                class="px-6 py-4
                                       text-left text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Event
                            </th>


                            <th
                                class="px-6 py-4
                                       text-left text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Tickets
                            </th>


                            <th
                                class="px-6 py-4
                                       text-left text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Amount
                            </th>


                            <th
                                class="px-6 py-4
                                       text-left text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Status
                            </th>


                            <th
                                class="px-6 py-4
                                       text-left text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Booking Date
                            </th>


                            <th
                                class="px-6 py-4
                                       text-right text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase"
                            >
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="bookingTableBody"
                        class="divide-y"
                    >
                    </tbody>

                </table>

            </div>

        </section>

        </div>
    </main>



    <!-- ========================================
         Booking Details Modal
    ========================================= -->

    <div
        id="bookingModal"
        class="hidden fixed inset-0
               bg-black/50 z-50
               flex items-center
               justify-center px-4"
    >

        <div
            class="bg-white rounded-2xl
                   shadow-xl w-full
                   max-w-2xl max-h-[90vh]
                   overflow-y-auto"
        >


            <!-- Modal Header -->

            <div
                class="flex items-center
                       justify-between
                       p-6 border-b"
            >

                <div>

                    <h2
                        class="text-xl font-bold"
                    >
                        Booking Details
                    </h2>

                    <p
                        id="modalBookingId"
                        class="text-sm text-gray-500 mt-1"
                    >
                    </p>

                </div>


                <button
                    type="button"
                    id="closeModalButton"
                    class="text-gray-500
                           hover:text-gray-800
                           text-2xl"
                >
                    &times;
                </button>

            </div>



            <!-- Modal Content -->

            <div
                id="bookingDetails"
                class="p-6 space-y-5"
            >
            </div>



            <!-- Modal Footer -->

            <div
                class="p-6 border-t
                       flex justify-end"
            >

                <button
                    type="button"
                    id="closeModalFooterButton"
                    class="px-5 py-2
                           rounded-lg
                           border
                           border-gray-300
                           hover:bg-gray-100"
                >
                    Close
                </button>

            </div>

        </div>

    </div>


     <!-- ======================================
         FOOTER
    ======================================= -->

    <footer class="mt-auto border-t border-gray-200 bg-white">

        <div
            class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8"
        >

            <div
                class="flex flex-col items-center justify-between gap-4 sm:flex-row"
            >

                <p class="text-sm text-gray-500">
                    © 2026 EventEase. All rights reserved.
                </p>

                <p class="text-sm text-gray-500">
                    Developed by <span class="font-bold text-[#e76f51]">Rakib</span>
                </p>

            </div>

        </div>

    </footer>


    <!-- ========================================
         JavaScript
    ========================================= -->

    <script
        src="../../js/organizer/bookings.js"
    ></script>

</body>

</html>
